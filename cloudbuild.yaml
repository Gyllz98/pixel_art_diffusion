steps:
- name: 'gcr.io/cloud-builders/docker'
  env:
    - 'DOCKER_BUILDKIT=1'
  args: [
    'build',
     'europe-docker.pkg.dev/$PROJECT_ID/pixel-art-repo/pixel-art-api:latest',
    '-t', 'europe-docker.pkg.dev/$PROJECT_ID/pixel-art-repo/pixel-art-api:latest',
    '.'
  ]
- name: 'gcr.io/cloud-builders/docker'
  id: 'Push container image'
  args: [
    'push',
    'europe-docker.pkg.dev/$PROJECT_ID/pixel-art-repo/pixel-art-api:latest'
  ]
options:
  logging: CLOUD_LOGGING_ONLY

steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build container image'
  env:
    - 'DOCKER_BUILDKIT=1'
  args: [
    'build',
    '.',
    '-t',
    'eu.gcr.io/$PROJECT_ID/pixel-art-api:latest',
    '-f',
    'dockerfiles/api.dockerfile'
  ]
- name: 'gcr.io/cloud-builders/docker'
  id: 'Push container image'
  args: [
    'push',
    'eu.gcr.io/$PROJECT_ID/pixel-art-api:latest'
  ]
options:
  logging: CLOUD_LOGGING_ONLY

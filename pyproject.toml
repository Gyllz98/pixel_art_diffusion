[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel_art_diffusion"
version = "0.0.1"
description = "Diffusion model for pixel art generation."
authors = [
  { name = "Gustav Toft", email = "gtoft98@gmail.com" },
]
license = { file = "LICENSE" }
keywords = ["machine learning", "MLOps"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies", "optional-dependencies"]

[project.scripts]
train = "pixel_art_diffusion.train:main"
evaluate = "pixel_art_diffusion.evaluate:main"
pixel-art-app = "pixel_art_diffusion.run_app:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
dev = {file = ['requirements_dev.txt']}

[tool.ruff]
line-length = 120

[tool.coverage.run]
omit = [
  "tests/*",
  "*/_remote_module_non_scriptable.py", 
  "*/var/folders/*", 
]

[tool.mypy]
files = ["pixel_art_diffusion", "tests"]
ignore_missing_imports = true
install_types = false